name: Update Cloudflare DNS records

on:
  push:
    branches:
      - master
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    name: Update Cloudflare DNS records
    steps:
      - uses: actions/checkout@v7
      - uses: pvinis/update-cloudflare-dns@v0.5.0
        with:
          zone: ね.co
          cloudflareToken: ${{ secrets.CLOUDFLARE_TOKEN }}
